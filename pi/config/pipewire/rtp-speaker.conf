# Separate PipeWire client process that receives the laptop's RTP audio and plays it to the
# default sink (the room speaker). Run by the user unit rtp-speaker.service, *after*
# WirePlumber has created the ALSA sink: loading rtp-source inside the main daemon's
# pipewire.conf.d fails at boot with "stream error: no node available" because the stream is
# created before any sink exists. Needs PipeWire >= 1.0 (pipewire-upstream PPA on jammy).
#
# Start:  pipewire -c rtp-speaker.conf     (looked up in ~/.config/pipewire/)
context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11  rt.prio = 80  rt.time.soft = -1  rt.time.hard = -1 }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }

    # The laptop (laptop/60-pi-speaker-rtp.conf) sends S16BE 48 kHz stereo unicast to UDP 46000.
    {   name = libpipewire-module-rtp-source
        args = {
            source.ip = "0.0.0.0"
            source.port = 46000
            sess.latency.msec = 200      # jitter buffer target; 100 ms dipped 3x in 2 min on Wi-Fi, 200 ms measured clean
            sess.ignore-ssrc = true      # laptop restarts change the SSRC; keep accepting
            node.always-process = true
            stream.props = {
                media.class = "Stream/Output/Audio"
                node.name = "laptop_rtp_in"
                node.description = "Laptop (RTP)"
            }
        }
    }
]
