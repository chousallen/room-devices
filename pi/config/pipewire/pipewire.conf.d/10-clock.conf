# Mixer clock for the room speaker (3.5 mm jack, PWM audio on bcm2835).
# 512 frames @ 48 kHz = ~10.7 ms per period. Lower min-quantum lets low-latency
# network clients ask for 256 (~5 ms) if the link is stable.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 512
    default.clock.min-quantum = 256
    default.clock.max-quantum = 2048
}
