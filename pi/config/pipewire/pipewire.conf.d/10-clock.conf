# Mixer clock for the room speaker (3.5 mm jack, PWM audio on bcm2835).
# The bcm2835 driver cannot sustain small periods: with the graph at 256 frames (5 ms; what
# Moonlight's audio stream or a floored pulse client asks for) it produced ~50 xruns/minute =
# spotty audio for every source. 1024 frames (21 ms) measured zero xruns even under 4x CPU load.
# min-quantum is the floor no client can push below.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 2048
}
