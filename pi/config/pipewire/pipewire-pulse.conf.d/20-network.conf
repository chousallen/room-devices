# PipeWire >= 1.0 drop-in (fragments merge; on 0.3.48 they did NOT and a full pipewire-pulse.conf
# copy was needed instead). Accept PulseAudio-protocol clients from the LAN (laptop tunnel).
# No authentication: home LAN + Tailscale only; the port is not forwarded.
pulse.properties = {
    server.address = [
        "unix:native"
        "tcp:4713"
    ]
    # Never let a client pull the graph below 1024 frames: the bcm2835 jack xruns below that.
    pulse.min.req     = 1024/48000
    pulse.min.quantum = 1024/48000
}
