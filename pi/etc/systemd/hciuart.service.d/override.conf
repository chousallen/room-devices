# Pi 4 + Ubuntu + USB boot: hciuart can start before /dev/serial1 exists (Launchpad #1929791).
# Requires= makes it a hard dependency; Restart covers the "fails occasionally" case
# (RPi-Distro/pi-bluetooth issue 32). ExecStartPre= clears an older sleep-10 workaround.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3
Requires=dev-serial1.device
After=dev-serial1.device

[Service]
ExecStartPre=
Restart=on-failure
RestartSec=5
