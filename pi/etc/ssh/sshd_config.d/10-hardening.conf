# Installed to /etc/ssh/sshd_config.d/10-hardening.conf. sshd takes the FIRST value it sees for a
# keyword, and the drop-ins are read in name order, so this file must sort before
# 50-cloud-init.conf (which sets PasswordAuthentication yes and beats 60-cloudimg-settings.conf's no).
# The router forwards TCP 22 to this Pi (probes from the internet arrive on eth0), so key-only login.
PermitRootLogin no
