# Longer graph cycles on the laptop. Sunshine's audio capture asks for 240 frames (5 ms), which forces
# every audio process (Spotify, games, the Pi-speaker RTP sender) to answer within 5 ms. Under a heavy
# compile (load ~27 on 20 threads) the RTP sender then missed cycles ("expected N != timestamp M" in
# `journalctl --user -u pi-speaker-rtp`, 181 in 5 min) = sub-second stutters on the Pi. With 1024-frame
# cycles (21 ms) the same build gave 1 miss in 5 min (measured 2026-10-26). Live equivalent:
# `pw-metadata -n settings 0 clock.min-quantum 1024`.
context.properties = {
    default.clock.min-quantum = 1024
}
