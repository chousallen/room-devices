# Laptop side: the Pi's speaker as an output device ("pi_speaker"), sent as PipeWire-native RTP
# (UDP unicast) to the Pi's rtp-speaker.service on UDP 46000. Delay is set on the Pi side
# (sess.latency.msec in pi/config/pipewire/rtp-speaker.conf).
#
# Runs as its own small PipeWire client process (user unit pi-speaker-rtp.service) instead of
# inside the main daemon's pipewire.conf.d, because module-rtp-sink creates and connect()s its
# UDP socket ONCE at load: after the laptop changes network (Wi-Fi roam, campus -> home) the
# socket keeps the old source address, every sendmsg() fails at debug log level only, and the
# sink sits IDLE forever. The 10 s user timer pi-speaker-watch starts this process only while the
# laptop is on the home Wi-Fi and the Pi answers ping, stops it otherwise (so the sink is not a
# black hole away from home), and restarts it when the socket's address has gone stale.
#
# Start:  pipewire -c pi-speaker-rtp.conf     (looked up in ~/.config/pipewire/)
context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11  rt.prio = 80  rt.time.soft = -1  rt.time.hard = -1 }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }

    {   name = libpipewire-module-rtp-sink
        args = {
            destination.ip = "192.168.0.101"     # Pi eth0
            destination.port = 46000
            source.ip = "0.0.0.0"
            net.mtu = 1280
            net.ttl = 1
            sess.min-ptime = 10
            sess.max-ptime = 20
            sess.name = "Room speaker (Pi)"
            audio.format = "S16BE"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]           # without this the sink reports aux0/aux1 and GNOME Settings shows no speaker-test buttons
            stream.props = {
                node.name = "pi_speaker"
                node.description = "Room speaker (Pi)"
                media.class = "Audio/Sink"
            }
        }
    }
]
