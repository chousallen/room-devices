# ~/.config/sunshine/sunshine.conf on the laptop (Sunshine build with laptop/sunshine-patches/0003).
# Scene-change quality (2026-10-13): use the full Intel encoder, not the low-power one, and let the
# first frame after a scene change spend up to 8 frames' worth of bitrate. Keep VBR: CBR pads every
# frame to a constant size (49 Mbps of filler on a still screen).
vaapi_low_power = 0
vaapi_vbv_frames = 8
vaapi_rc_mode = 1
