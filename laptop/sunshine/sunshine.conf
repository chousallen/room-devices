# ~/.config/sunshine/sunshine.conf on the laptop (Sunshine build with laptop/sunshine-patches/0003).
# Scene-change quality (2026-10-13): constant QP. The Intel encoder never refines a still picture under
# VBR, and a max-QP ceiling makes it re-encode the desktop at 30 Hz forever (17-35 Mbps idle). With a
# fixed QP every frame, including the first one after a window switch, is coded at the same quality,
# still frames cost ~4 kB, and the client bitrate setting is ignored (bursts ~3.5 MB per full-screen
# change, ~60 Mbps sustained on noise-like video). qp 22: text crisp, 10 % fewer bits than qp 20.
vaapi_low_power = 0
vaapi_rc_mode = 3
qp = 22
