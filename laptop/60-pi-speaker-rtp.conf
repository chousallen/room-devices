# Laptop side: the Pi's speaker as an output device, sent as PipeWire-native RTP (UDP unicast).
# Install to ~/.config/pipewire/pipewire.conf.d/60-pi-speaker-rtp.conf, then
#   systemctl --user restart pipewire
# UDP is fire-and-forget: no reconnect logic needed, laptop audio keeps working when the Pi is
# off. Delay is set on the Pi side (sess.latency.msec in pi/config/pipewire/pipewire.conf.d/).
context.modules = [
    {   name = libpipewire-module-rtp-sink
        args = {
            destination.ip = "192.168.0.101"
            destination.port = 46000
            source.ip = "0.0.0.0"
            net.mtu = 1280
            net.ttl = 1
            sess.min-ptime = 10
            sess.max-ptime = 20
            sess.name = "Room speaker (Pi)"
            audio.format = "S16BE"
            audio.rate = 48000
            audio.channels = 2
            stream.props = {
                node.name = "pi_speaker"
                node.description = "Room speaker (Pi)"
                media.class = "Audio/Sink"
            }
        }
        flags = [ nofail ]
    }
]
