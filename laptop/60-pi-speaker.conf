# Laptop side: expose the Pi's speaker as a normal PipeWire output device ("Room speaker (Pi)").
# Install to ~/.config/pipewire/pipewire.conf.d/60-pi-speaker.conf and run
#   systemctl --user restart pipewire
# pulse.latency is the end-to-end target in ms. Lower = less delay, more dropout risk
# (laptop is on Wi-Fi). Tuned value recorded in CLAUDE.md.
context.modules = [
    {   name = libpipewire-module-pulse-tunnel
        args = {
            tunnel.mode = sink
            pulse.server.address = "tcp:192.168.0.101:4713"
            pulse.latency = 80
            reconnect.interval.ms = 5000
            stream.props = {
                node.name        = "pi_speaker"
                node.description = "Room speaker (Pi)"
                media.class      = "Audio/Sink"
            }
        }
        # nofail: laptop audio must keep working when the Pi is off
        flags = [ nofail ]
    }
]
